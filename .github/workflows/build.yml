name: Build and Test

# Fast PR checks only (about 5 minutes): build and SQLite tests per Automate line at the floor and at the latest minor,
# the credential-helper copy check, gitleaks, osv-scanner and check-vulnerable. Never add e2e or SQL Server here: they live
# in release-checks.yml, which is run by hand.
# eng/lines.txt is the single list of lines (18 only for now); the matrix follows it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        # Only digits are accepted, so a bad edit cannot reach a shell command.
        run: |
          set -euo pipefail
          lines="$(grep -vE '^\s*(#|$)' eng/lines.txt | tr -d ' \r')"
          if grep -qvE '^[0-9]+$' <<<"$lines"; then
            echo "eng/lines.txt must hold one numeric line per row" >&2
            exit 1
          fi
          echo "matrix=$(jq -cn --arg l "$lines" '$l | split("\n")')" >> "$GITHUB_OUTPUT"

  build:
    needs: lines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.lines.outputs.matrix) }}
        # floor: locked restore at the committed per-line lock files.
        # latest: newest <line>.x of Automate and the CMS (AutomateFloat=true), restored unlocked; never committed.
        leg: [floor, latest]
    env:
      LINE: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          # NuGet cache keyed on the per-line lock files. Not used in publish.yml, so a release never restores from a PR-filled cache.
          cache: true
          cache-dependency-path: '**/packages.*.lock.json'

      - name: Restore (floor, locked)
        if: matrix.leg == 'floor'
        run: dotnet restore src/Umbraco.Community.Automate.DeployHooks.slnx --locked-mode "-p:AutomateMajor=$LINE"

      - name: Lock files unchanged
        if: matrix.leg == 'floor'
        run: git diff --exit-code -- '**/packages.*.lock.json'

      - name: Restore (latest, floating)
        if: matrix.leg == 'latest'
        run: dotnet restore src/Umbraco.Community.Automate.DeployHooks.slnx --force-evaluate "-p:AutomateMajor=$LINE" -p:AutomateFloat=true

      - name: Build
        run: dotnet build src/Umbraco.Community.Automate.DeployHooks.slnx -c Release --no-restore "-p:AutomateMajor=$LINE" -p:AutomateFloat=${{ matrix.leg == 'latest' }}

      # Unit and integration tests (SQLite). SQL Server and e2e run in release-checks.yml.
      - name: Test
        run: dotnet test src/Umbraco.Community.Automate.DeployHooks.slnx -c Release --no-build "-p:AutomateMajor=$LINE" -p:AutomateFloat=${{ matrix.leg == 'latest' }} --logger "trx;LogFileName=results.trx"

      - name: Resolved Automate version (latest)
        if: matrix.leg == 'latest'
        # `dotnet list package` rejects -p: properties, so the line goes in as environment variables.
        run: AutomateMajor="$LINE" AutomateFloat=true dotnet list src/Umbraco.Community.Automate.DeployHooks.slnx package | grep Umbraco.Automate.Core

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.line }}-${{ matrix.leg }}
          path: '**/results.trx'

  # The credential helper is a verbatim copy (credential-helper-contract section 4 items 12 and 13). This diffs the
  # store and both suites against the Jira repo at the tag and compares CanonicalHash with the published value.
  contract-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Credential helper matches the frozen tag
        run: bash build/check-contract-copy.sh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Scans every commit in the PR range: put `// gitleaks:allow` on fake test secrets in the commit that adds them.
      - name: gitleaks
        run: bash build/gitleaks.sh "${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"

  # The lock files are named per line, which osv-scanner does not recognise, so each is passed explicitly.
  # Add a new project's lock files here, for every line in eng/lines.txt.
  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks/packages.18.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks/packages.17.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks.Tests/packages.18.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks.Tests/packages.17.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks.IntegrationTests/packages.18.lock.json
        --lockfile=packages.lock.json:./src/Umbraco.Community.Automate.DeployHooks.IntegrationTests/packages.17.lock.json
        --lockfile=packages.lock.json:./demo/Umbraco.Community.Automate.DeployHooks.DemoSite/packages.18.lock.json
        --lockfile=packages.lock.json:./demo/Umbraco.Community.Automate.DeployHooks.DemoSite/packages.17.lock.json

  deps:
    needs: osv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.*.lock.json'
      # check-vulnerable.sh --line does the locked restore for that line itself and audits that restore, so every line
      # in eng/lines.txt is covered and a new line needs no edit here.
      - name: Vulnerable packages per line (direct and transitive)
        run: |
          set -euo pipefail
          while read -r line; do
            bash build/check-vulnerable.sh --line "$line"
          done < <(grep -vE '^\s*(#|$)' eng/lines.txt | tr -d ' \r')
