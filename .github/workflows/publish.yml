name: publish

# Runs on a version tag pushed by Pascal after the release PR is squash-merged. The tag's major picks the lines:
# v18.<minor>.<patch>[-<suffix>] packs 18.<minor>.<patch>[-<suffix>] and 17.<minor>.<patch>[-<suffix>] (one tag
# ships both lines), v19.<minor>.<patch>[-<suffix>] packs line 19 only (19.<minor>.<patch>[-<suffix>]), so a 19 release
# never republishes the 17 and 18 versions. Run "release-checks" on the release PR first.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # All build and test code runs here with read-only permissions, so none of it can request the OIDC token that
  # publishes. No NuGet cache: a release never restores from a cache a PR filled (portfolio CI rule 8).
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          lines="$(grep -vE '^\s*(#|$)' eng/lines.txt | tr -d ' \r')"
          if grep -qvE '^[0-9]+$' <<<"$lines"; then
            echo "eng/lines.txt must hold one numeric line per row" >&2; exit 1
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z][0-9A-Za-z.-]*))?$ ]]; then
            echo "Tag $TAG is not v<line>.<minor>.<patch>[-<suffix>]" >&2; exit 1
          fi
          major="${BASH_REMATCH[1]}"
          case "$major" in
            19) lines_sel="$(grep -x 19 <<<"$lines" || true)"; sdk="11.x" ;;
            18) lines_sel="$(grep -x -e 17 -e 18 <<<"$lines" || true)"; sdk="10.x" ;;   # packs 17 and 18, exactly as before 19
            *)  echo "Tag $TAG: major must be 18 or 19" >&2; exit 1 ;;
          esac
          if [ -z "$lines_sel" ]; then
            echo "Tag $TAG selects no line in eng/lines.txt" >&2; exit 1
          fi
          {
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
            echo "suffix=${BASH_REMATCH[5]}"
            echo "lines=$(tr '\n' ' ' <<<"$lines_sel")"
            echo "sdk=$sdk"
            echo "sdk_major=${sdk%%.*}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 19 targets net11.0 and needs the 11 SDK; a v18 tag only packs 17 and 18. The tag is parsed first, so the SDK follows it.
          dotnet-version: ${{ steps.tag.outputs.sdk }}

      - name: Pin the SDK to the 10 line
        if: steps.tag.outputs.sdk_major == '10'
        # Hosted runners ship SDK 11 too, and global.json (latestMajor, needed for line 19) would pick it. 17 and 18
        # are tested and released on SDK 10, so pin this job's copy; it is never committed.
        run: printf '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":false}}\n' > global.json
      - name: Check the SDK major
        env:
          EXPECTED: ${{ steps.tag.outputs.sdk_major }}
        run: |
          # global.json rolls forward to the newest installed major, so assert the line got the SDK it was tested on.
          actual="$(dotnet --version)"
          [[ "$actual" == "$EXPECTED".* ]] || { echo "Expected a .NET $EXPECTED SDK, got $actual" >&2; exit 1; }
      - name: Tag is on main and in the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          # Whole-line match: "## 18.0.0" must not be satisfied by "## 18.0.0-beta.1" or "## 18.0.10".
          grep -qxF "## ${TAG#v}" CHANGELOG.md || { echo "CHANGELOG.md has no '## ${TAG#v}' heading line" >&2; exit 1; }

      - name: Test, audit and pack every line
        env:
          LINES: ${{ steps.tag.outputs.lines }}
          MINOR: ${{ steps.tag.outputs.minor }}
          PATCH: ${{ steps.tag.outputs.patch }}
          SUFFIX: ${{ steps.tag.outputs.suffix }}
        run: |
          set -euo pipefail
          for line in $LINES; do
            dotnet restore src/Umbraco.Community.Automate.DeployHooks.slnx --locked-mode -p:AutomateMajor="$line"
            dotnet test src/Umbraco.Community.Automate.DeployHooks.slnx -c Release --no-restore -p:AutomateMajor="$line" --logger "console;verbosity=minimal"
            bash build/check-vulnerable.sh --line "$line"
            bash build/pack.sh "$line" ./artifacts "$MINOR" "$PATCH" ${SUFFIX:+"$SUFFIX"}
          done
          # One package per selected line: v18.* gives 2, v19.* gives 1.
          packs=(./artifacts/*.nupkg)
          expected="$(wc -w <<<"$LINES" | tr -d ' ')"
          [ "${#packs[@]}" -eq "$expected" ] || { echo "Expected $expected nupkg(s), found ${#packs[@]}" >&2; exit 1; }
          for pkg in "${packs[@]}"; do bash build/check-packed-readme.sh "$pkg"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error

  # The only job that can mint the OIDC token. It checks out nothing and runs no project code. A required
  # reviewer approves each run (environment "nuget").
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing: no long-lived API key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: ./artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.x"
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"
